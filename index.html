<!DOCTYPE html>
<html>

<head>
<title>Distance Quest 4.0</title>

<style>

body{
margin:0;
overflow:hidden;
font-family:monospace;
background:linear-gradient(#3b5d9a,#1d2b53);
color:white;
}

#score{
position:absolute;
top:10px;
left:10px;
background:black;
padding:10px;
border-radius:10px;
}

#boss{
position:absolute;
top:10px;
right:10px;
background:black;
padding:10px;
border-radius:10px;
}

#knight{
position:absolute;
bottom:100px;
left:60px;
font-size:60px;
transition:1s;
}

#princess{
position:absolute;
bottom:100px;
right:60px;
font-size:60px;
}

#cat{
position:absolute;
bottom:60px;
left:200px;
font-size:40px;
}

.heart{
position:absolute;
font-size:30px;
cursor:pointer;
}

#monster{
position:absolute;
top:200px;
right:200px;
font-size:80px;
}

button{
padding:10px 20px;
border:none;
background:#ff77aa;
cursor:pointer;
}

#textBox{
position:absolute;
bottom:0;
width:100%;
background:rgba(0,0,0,0.7);
padding:20px;
text-align:center;
}

.lantern{
position:absolute;
font-size:40px;
animation:float 5s linear infinite;
}

@keyframes float{
0%{transform:translateY(0);opacity:1;}
100%{transform:translateY(-600px);opacity:0;}
}

</style>
</head>

<body>

<div id="score">Hearts: 0</div>
<div id="boss">Monster HP: <span id="hp">100</span></div>

<div id="knight">🛡️</div>
<div id="princess">👑</div>
<div id="cat">🐱</div>
<div id="monster">👾</div>

<div id="textBox">
<span id="text">Collect hearts to defeat the Distance Monster!</span>
<br><br>
<button onclick="attack()">Attack Monster ⚔️</button>
</div>

<script>

let hearts=0
let hp=100
let knightPos=60

function spawnHeart(){

let heart=document.createElement("div")
heart.className="heart"
heart.innerHTML="💖"

heart.style.left=Math.random()*window.innerWidth+"px"
heart.style.top=(100+Math.random()*300)+"px"

heart.onclick=function(){

hearts++
document.getElementById("score").innerHTML="Hearts: "+hearts

heart.remove()

moveKnight()

}

document.body.appendChild(heart)

}

setInterval(spawnHeart,2000)

function moveKnight(){

knightPos+=40
document.getElementById("knight").style.left=knightPos+"px"

}

function attack(){

if(hearts<=0){
alert("Collect hearts first!")
return
}

hp-=10
hearts--

document.getElementById("hp").innerText=hp
document.getElementById("score").innerText="Hearts: "+hearts

if(hp<=0){
victory()
}

}

function victory(){

document.getElementById("monster").remove()

document.getElementById("text").innerHTML=
"The Distance Monster is defeated. Hubby reaches My Buwan."

nightScene()

}

function nightScene(){

document.body.style.background="linear-gradient(#020111,#191621)"

setInterval(()=>{

let lantern=document.createElement("div")
lantern.className="lantern"
lantern.innerHTML="🏮"

lantern.style.left=Math.random()*window.innerWidth+"px"
lantern.style.top="500px"

document.body.appendChild(lantern)

setTimeout(()=>lantern.remove(),5000)

},800)

}

setInterval(()=>{

let cat=document.getElementById("cat")
cat.style.left=Math.random()*window.innerWidth+"px"

},4000)

</script>

</body>
</html>
